    <script>
        function resizeMap() {
            var img = document.getElementById('stalker-map');
            var map = document.getElementsByName('zone_map')[0];
            var areas = map.getElementsByTagName('area');

            if (!img.naturalWidth) return;

            var ratio = img.clientWidth / img.naturalWidth;

            for (var i = 0; i < areas.length; i++) {
                if (!areas[i].dataset.originalCoords) {
                    areas[i].dataset.originalCoords = areas[i].coords;
                }
                
                var originalCoords = areas[i].dataset.originalCoords.split(',');
                var scaledCoords = [];
                
                for (var j = 0; j < originalCoords.length; j++) {
                    scaledCoords.push(Math.round(originalCoords[j] * ratio));
                }
                
                areas[i].coords = scaledCoords.join(',');
            }
        }

        window.addEventListener('load', resizeMap);
        window.addEventListener('resize', resizeMap);
    </script>
