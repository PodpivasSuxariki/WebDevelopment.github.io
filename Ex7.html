<!DOCTYPE html>
<html lang="ru">
<head>
    <link rel="stylesheet" href="style.css">
    <title>Времена года и Школьные предметы</title>

    <script language="JavaScript" type="text/JavaScript">
        function showSubjects() {
            var subjects = new Array("Алгебра", "Геометрия", "Физика", "История", "Литература", "Русский язык");
            
            var exactSciences = subjects.slice(0, 3);
            var humanities = subjects.slice(3, 6);
            
            document.write("<h3>Точные науки:</h3>");
            document.write(exactSciences + "<br>");
            
            document.write("<h3>Гуманитарные науки:</h3>");
            document.write(humanities + "<br>");
        }
    </script>
</head>
<body>
    <nav id="main-menu"></nav>
    <script src="menu.js"></script>

    <h2>Времена года</h2>
    <script language="JavaScript" type="text/JavaScript">
        var year = new Array("декабрь", "январь", "февраль", "март", "апрель", "май", "июнь", "июль", "август", "сентябрь", "октябрь", "ноябрь");
        var summer = year.slice(6, 9);
        
        document.write("Летние месяцы: " + summer + "<br>");
    </script>

    <h2>Разделение школьных предметов</h2>
    <script language="JavaScript" type="text/JavaScript">
        showSubjects();  
    </script>
</body>
</html>
